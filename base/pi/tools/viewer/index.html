<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot view</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>Robot view</h1>
        <p>Help Me Carry base, live from the Pi</p>
      </div>
    </div>
    <nav>
      <a href="/" class="here">Home</a>
      <a href="/camera">Camera</a>
      <a href="/lidar">LiDAR</a>
    </nav>
  </header>
  <main>
    <div class="stats">
      <div class="stat" id="stat-near"><div class="label">Nearest obstacle</div><div class="value">-</div></div>
      <div class="stat" id="stat-points"><div class="label">LiDAR points</div><div class="value">-</div></div>
      <div class="stat" id="stat-age"><div class="label">Scan age</div><div class="value">-</div></div>
    </div>
    <div class="grid">
      <section class="card">
        <div class="card-head">
          <h2><a href="/camera">Camera</a><span>Xtion colour</span></h2>
          <span class="badge camera-badge">Connecting</span>
        </div>
        <div class="card-body"><img class="camera" src="/stream" alt="Robot camera"></div>
        <div class="card-foot">320x240, up to 30 frames a second</div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2><a href="/lidar">LiDAR</a><span>from above</span></h2>
          <span class="badge lidar-badge">Connecting</span>
        </div>
        <div class="card-body"><canvas class="scan"></canvas></div>
        <div class="card-foot scan-info">waiting for the LiDAR</div>
      </section>
    </div>
  </main>
  <script src="/lidar.js"></script>
</body>
</html>
