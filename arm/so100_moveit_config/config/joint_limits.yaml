# Velocity kept modest (12V 2A adapter). Acceleration is high on purpose: long slow ramps at
# near-zero speed made the base/shoulder/elbow judder (A/B test 2026-11-07).
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 1.0
joint_limits:
  shoulder_pan:  {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 6.0, has_deceleration_limits: true, max_deceleration: -6.0}
  shoulder_lift: {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 6.0, has_deceleration_limits: true, max_deceleration: -6.0}
  elbow_flex:    {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 6.0, has_deceleration_limits: true, max_deceleration: -6.0}
  wrist_flex:    {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 6.0, has_deceleration_limits: true, max_deceleration: -6.0}
  wrist_roll:    {has_velocity_limits: true, max_velocity: 1.5, has_acceleration_limits: true, max_acceleration: 6.0, has_deceleration_limits: true, max_deceleration: -6.0}
  gripper:       {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 12.0, has_deceleration_limits: true, max_deceleration: -12.0}
