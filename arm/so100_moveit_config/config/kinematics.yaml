# pick_ik copes with this 5-joint arm (a full 6-D pose is usually unreachable).
# rotation_scale 0: dragging the marker only sets the TCP position; wrist joints stay
# as close as possible to their current angles (set them in the Joints tab if needed).
arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.1
  kinematics_solver_attempts: 3
  mode: global
  position_scale: 1.0
  rotation_scale: 0.0
  position_threshold: 0.002
  orientation_threshold: 0.05
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
