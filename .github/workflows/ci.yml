name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hmc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,plot]"
      - name: Run tests
        run: .venv/bin/pytest -q
      - name: Run scenario
        run: .venv/bin/python -m hmc.run --out out
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: scenario-output
          path: hmc/out/
